name: Android release

# Builds a signed AAB. Tag pushes (v1.2.3) and manual runs both upload it as an
# artifact; if PLAY_SERVICE_ACCOUNT_JSON exists it also goes to Google Play.
# The very first AAB must be uploaded by hand in Play Console (the API cannot create the app).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, production]
        default: internal
      status:
        description: Release status (draft is required while the app itself is still a draft in Play Console)
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # versionCode = run number + offset. Never lower the offset: Play needs it to keep increasing.
  VERSION_CODE_OFFSET: 100

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve version
        id: version
        run: |
          app_version=$(node -p "require('./app.config.json').version")
          app_id=$(node -p "require('./app.config.json').appId")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            if [ "$name" != "$app_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match app.config.json version $app_version"
              exit 1
            fi
          else
            name="$app_version"
          fi
          code=$((GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "### $app_id $name (versionCode $code)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No upload key yet. Run the 'Create upload key' workflow first (see docs/RELEASE.md)."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew bundleRelease --no-daemon
      - name: Verify signature and rename
        id: aab
        run: |
          src=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$src" | grep -q 'jar verified' || { echo "::error::AAB is not signed"; exit 1; }
          out="fletchy-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.aab"
          mkdir -p release && cp "$src" "release/$out"
          cp android/app/build/outputs/mapping/release/mapping.txt release/mapping.txt
          echo "path=release/$out" >> "$GITHUB_OUTPUT"
          echo "Signed AAB: \`$out\` ($(du -h "$src" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: fletchy-release-aab
          path: release
          if-no-files-found: error
          retention-days: 90
      - name: Check Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No PLAY_SERVICE_ACCOUNT_JSON secret: skipped the Play upload. Download the AAB artifact instead." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.version.outputs.app_id }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'draft' }}
          mappingFile: release/mapping.txt
