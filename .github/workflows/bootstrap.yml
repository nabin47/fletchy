name: Bootstrap

# One-time scaffolding (PLAN.md Section 3): refreshes the lockfile, renders
# icons, generates the native projects and opens a PR with the result.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_dispatch:
    inputs:
      add_ios:
        description: Also generate the ios/ project
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: bootstrap/native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install (creates or refreshes package-lock.json)
        run: npm install
      - name: Add @capacitor/ios
        if: inputs.add_ios
        run: npm install @capacitor/ios@^8.5.3
      - name: Render icons and splash from SVG
        run: npm run icons
      - run: npm run build
      - name: Add Android platform
        if: hashFiles('android/build.gradle') == ''
        run: npx cap add android
      - name: Add iOS platform
        if: inputs.add_ios && hashFiles('ios/App/App.xcodeproj/project.pbxproj') == ''
        run: npx cap add ios
      - name: Generate native icons and splash screens
        run: |
          platforms="--android"
          if [ "${{ inputs.add_ios }}" = "true" ]; then platforms="$platforms --ios"; fi
          bg=$(node -p "require('./app.config.json').backgroundColor")
          npx --yes @capacitor/assets@3.0.5 generate --assetPath resources $platforms \
            --iconBackgroundColor "$bg" --iconBackgroundColorDark "$bg" \
            --splashBackgroundColor "$bg" --splashBackgroundColorDark "$bg"
      - name: Apply Android customizations
        run: npm run android:customize
      - run: npx cap sync
      - name: Commit, push and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Bootstrap native projects, lockfile and icons"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.ref_name }}" \
              --title "Bootstrap native projects" \
              --body "Generated by the Bootstrap workflow (run ${{ github.run_id }}): lockfile refresh, rendered icons, \`android/\`${{ inputs.add_ios && ' and \`ios/\`' || '' }} with PLAN.md Section 6 customizations."
          fi
